<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saray.dev | Desarrolladora web</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#26262A', wine: '#9E1030', cream: '#F1E8DF' },
          fontFamily: {
            display: ['Poppins', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cream text-ink font-body antialiased">

  <nav id="menu" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-6 rounded-full bg-ink text-cream px-5 py-2.5 shadow-lg" aria-label="Principal">
    <a href="#inicio" class="font-display font-semibold text-lg">Saray<span class="text-wine">.</span>dev</a>
    <ul class="hidden md:flex items-center gap-5 text-sm">
      <li><a href="#sobre-mi" class="hover:text-wine transition-colors">Sobre mí</a></li>
      <li><a href="#servicios" class="hover:text-wine transition-colors">Servicios</a></li>
      <li><a href="#proyectos" class="hover:text-wine transition-colors">Proyectos</a></li>
      <li><a href="#tecnologias" class="hover:text-wine transition-colors">Tecnologías</a></li>
      <li><a href="#contacto" class="hover:text-wine transition-colors">Contacto</a></li>
    </ul>
    <a href="#contacto" class="md:hidden rounded-full bg-wine text-cream text-sm font-medium px-4 py-1.5">Contacto</a>
  </nav>

  <main>
    <section id="inicio" data-bg="cream" class="min-h-screen"></section>
    <section id="sobre-mi" data-bg="cream" class="min-h-screen"></section>
    <section id="servicios" data-bg="cream" class="min-h-screen"></section>
    <section id="proyectos" data-bg="cream" class="min-h-screen"></section>
    <section id="tecnologias" data-bg="ink" class="min-h-screen"></section>
    <section id="contacto" data-bg="wine" class="min-h-screen"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
